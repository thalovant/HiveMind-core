permissions:
  contents: write
  pull-requests: write

name: Publish Stable Release

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  publish_stable:
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-stable.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      version_file: 'hivemind_core/version.py'
      publish_pypi: true
      notify_matrix: true
