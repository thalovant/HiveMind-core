permissions:
  contents: read

name: Integration Tests (live OVOS)

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@e1770fb608f8c39ab886ff336f6470ee17747b0d # dev
    with:
      python_versions: '["3.11"]'
      system_deps: 'python3-dev swig'
      install_extras: 'integration'
      test_path: 'tests/e2e/test_query_ovoscope_e2e.py'
