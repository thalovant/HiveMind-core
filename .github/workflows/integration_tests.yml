permissions:
  contents: read
  pull-requests: write

name: Integration Tests (live OVOS)

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      python_versions: '["3.11"]'
      system_deps: 'python3-dev swig'
      install_extras: 'integration'
      test_path: 'tests/e2e/test_query_ovoscope_e2e.py'
