permissions:
  contents: read
  pull-requests: write

name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      # The package itself ships under Apache-2.0 — exclude it from the
      # downstream-licence audit to avoid self-flagging.
      # Use the same pattern shape the upstream action's docs recommend.
      exclude_packages: '(?i)^(hivemind|hivescope|z85base91|poorman|filelock|tqdm).*'
