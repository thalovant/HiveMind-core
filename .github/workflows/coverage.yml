permissions:
  contents: read

name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@e1770fb608f8c39ab886ff336f6470ee17747b0d # dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_core'
      test_path: 'tests/e2e/'
      test_extras: 'test'
