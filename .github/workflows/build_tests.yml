name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    name: build-tests (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel pytest
          python -m pip install "hivescope @ git+https://github.com/JarbasHiveMind/hivescope@dev"

      - name: Build distribution packages
        run: python -m build

      - name: Install built wheel
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          test -n "$WHEEL"
          python -m pip install "$WHEEL"

      - name: Run tests
        run: python -m pytest tests/ -v
