permissions:
  contents: read
  pull-requests: write

name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # version policy lives in pyproject.toml; just install the test extra
      # (pulls hivescope + the 2.x stack via the declared floors).
      install_extras: 'test'
      test_path: 'tests/'
